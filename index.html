<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>在庫記録</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#16191d;--sub:#5f6b78;--line:#dde1e7;--pri:#1d5fd1;--priInk:#fff;--soft:#eaf1fd;--ok:#17803a;--bad:#c42b2b;--chip:#eef1f5}
@media (prefers-color-scheme: dark){:root{--bg:#111315;--card:#1b1e22;--ink:#e9ebee;--sub:#9aa4af;--line:#2d3238;--pri:#5b93ff;--priInk:#0b1220;--soft:#1d2a40;--ok:#4cc27a;--bad:#ff6b6b;--chip:#252a30}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:600}
h1{font-size:24px;margin:2px 0 8px;line-height:1.25}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.stock{display:flex;gap:10px;margin-top:12px}
.stock div{flex:1;background:var(--chip);border-radius:12px;padding:8px 12px}
.stock small{display:block;font-size:12px;color:var(--sub)}
.stock b{font-size:22px}
select{width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);appearance:none;-webkit-appearance:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button,.dest button,.quick button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 4px;font-weight:700;font-size:15px}
.seg button.on,.dest button.on{background:var(--pri);border-color:var(--pri);color:var(--priInk)}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:64px;height:64px;border-radius:16px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:30px;font-weight:700}
.qty input{flex:1;min-width:0;height:64px;text-align:center;font-size:34px;font-weight:800;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
.unit{font-size:15px;color:var(--sub);min-width:28px}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.go{width:100%;font:inherit;font-size:19px;font-weight:800;padding:18px;border:0;border-radius:16px;background:var(--pri);color:var(--priInk);margin-top:4px}
.go:disabled{opacity:.5}
.sub{width:100%;font:inherit;font-size:16px;font-weight:700;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-top:8px}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
.memo{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.done{text-align:center;padding:28px 16px}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:40px;line-height:72px;margin:0 auto 12px;font-weight:800}
.err{display:none;background:var(--bad);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none}
.hide{display:none}
.center{text-align:center;padding:40px 16px;color:var(--sub)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;margin:0 auto 14px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{color:var(--sub);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div id="err" class="err"></div>

  <div id="loading" class="center"><div class="spin"></div>読み込み中…</div>

  <div id="keyBox" class="card hide">
    <p class="lbl">合言葉を入力してください（最初の1回だけ）</p>
    <input id="keyIn" class="memo" style="font-size:18px;padding:12px" autocomplete="off">
    <button class="go" id="keyGo" style="margin-top:12px">決定</button>
  </div>

  <div id="retryBox" class="hide" style="text-align:center">
    <button class="go" id="retry">もう一度読み込む</button>
  </div>

  <div id="form" class="hide">
    <div id="pickers" class="card hide">
      <p class="lbl">製品</p>
      <select id="selProd"></select>
      <p class="lbl" style="margin-top:12px">保管場所</p>
      <select id="selLoc"></select>
    </div>

    <div class="card" id="head">
      <span class="chip" id="locChip"></span>
      <h1 id="pName"></h1>
      <div class="stock">
        <div><small>この場所の在庫</small><b id="stLoc">-</b> <span class="u"></span></div>
        <div><small>全体の在庫</small><b id="stAll">-</b> <span class="u"></span></div>
      </div>
    </div>

    <div class="card">
      <p class="lbl">記録する人</p>
      <select id="selStaff"></select>
    </div>

    <div class="card">
      <p class="lbl">何をしますか</p>
      <div class="seg" id="seg"></div>
      <div id="destBox" class="hide" style="margin-top:14px">
        <p class="lbl">移動先</p>
        <div class="dest" id="dest"></div>
      </div>
    </div>

    <div class="card">
      <p class="lbl" id="qtyLbl">持ち出す数</p>
      <div class="qty">
        <button type="button" id="minus" aria-label="減らす">−</button>
        <input id="qty" type="number" inputmode="numeric" min="0" value="1">
        <button type="button" id="plus" aria-label="増やす">＋</button>
      </div>
      <div class="quick" id="quick"></div>
      <div class="hint" id="qtyHint"></div>
      <details style="margin-top:12px"><summary>メモを残す（任意）</summary>
        <input id="memo" class="memo" style="margin-top:8px" maxlength="200" placeholder="例：〇〇現場用">
      </details>
    </div>

    <button class="go" id="go">記録する</button>
  </div>

  <div id="doneView" class="card done hide">
    <div class="check">✓</div>
    <h1 style="font-size:22px">記録しました</h1>
    <p id="doneMsg" style="color:var(--sub);margin:4px 0 14px"></p>
    <div class="stock" style="text-align:left">
      <div><small>この場所の在庫</small><b id="dLoc">-</b> <span class="u"></span></div>
      <div><small>全体の在庫</small><b id="dAll">-</b> <span class="u"></span></div>
    </div>
    <button class="go" id="again" style="margin-top:18px">続けて記録する</button>
    <button class="sub" id="undo">間違えたので取り消す</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

var API_URL = 'https://script.google.com/macros/s/AKfycbzAdb0Bwur_7pBywLhZPS6JU7IlRnC2ZUIbldQMAxImPyk-BoKWuUn9j13a3nXCnhKwaA/exec';

var LABEL = {'持ち出し':'持ち出す数','移動':'移動する数','入荷':'入荷した数','棚卸し':'今ここにある数（数えた数）'};
var HINT = {'持ち出し':'','移動':'この場所から減り、移動先に増えます','入荷':'入荷は必ず記録してください','棚卸し':'記録された在庫ではなく、実際に数えた数を入れてください'};
var Q = new URLSearchParams(location.search);
var D = null;
var S = {pid:Q.get('p')||'', loc:'', type:'持ち出し', dest:'', lastId:null};
var ready = false;

function $(id){ return document.getElementById(id); }
function prod(){ for (var i=0;i<D.products.length;i++){ if (D.products[i].id===S.pid) return D.products[i]; } return null; }
function stockAt(loc){ var s=D.stock[S.pid]||{}; return s[loc]||0; }
function stockAll(){ var s=D.stock[S.pid]||{}, t=0; for (var k in s) t+=Number(s[k])||0; return t; }
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function opt(sel, val, text){ var o=document.createElement('option'); o.value=val; o.textContent=text; sel.appendChild(o); }
function btn(parent, text, cls, fn){ var b=document.createElement('button'); b.type='button'; b.textContent=text; if(cls) b.className=cls; b.onclick=fn; parent.appendChild(b); return b; }
function showErr(m){ var e=$('err'); e.textContent=m; e.style.display=m?'block':'none'; if(m) window.scrollTo(0,0); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){ t.style.display='none'; }, 2200); }
function show(id, on){ $(id).classList.toggle('hide', !on); }

/* スプレッドシートとのやり取り（Googleのログイン情報は使いません） */
function api(action, extra){
  var body = {action:action, key:load('inv_key')||''};
  for (var k in (extra||{})) body[k]=extra[k];
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), credentials:'omit', redirect:'follow'})
    .catch(function(){ throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください'); })
    .then(function(r){ if (!r.ok) throw new Error('通信エラー（'+r.status+'）'); return r.json(); })
    .then(function(res){
      if (res.needKey){ var e=new Error(res.error||'合言葉を入力してください'); e.needKey=true; throw e; }
      if (!res.ok) throw new Error(res.error||'エラーが発生しました');
      return res;
    });
}

function boot(){
  showErr(''); show('loading', true); show('retryBox', false); show('keyBox', false); show('form', false);
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)){
    show('loading', false); showErr('設定エラー：index.html の API_URL にウェブアプリのURL（末尾 /exec）を貼り付けてください'); return;
  }
  api('init').then(function(data){
    D=data;
    var l=Q.get('l')||'';
    S.loc = /^\d+$/.test(l) ? (D.locations[Number(l)-1]||'') : l;
    show('loading', false); show('form', true);
    if (!ready){ init(); ready=true; } else { render(); }
  }).catch(function(e){
    show('loading', false);
    if (e.needKey){ show('keyBox', true); if (load('inv_key')) showErr('合言葉が違います'); return; }
    showErr(e.message); show('retryBox', true);
  });
}

function init(){
  var ss=$('selStaff'); opt(ss,'','名前を選んでください');
  D.staff.forEach(function(n){ opt(ss,n,n); });
  var saved=load('inv_staff'); if (saved && D.staff.indexOf(saved)>=0) ss.value=saved;
  ss.onchange=function(){ store('inv_staff', ss.value); };

  var validP = !!prod(), validL = D.locations.indexOf(S.loc)>=0;
  if (!validP || !validL){
    show('pickers', true);
    var sp=$('selProd'); opt(sp,'','製品を選んでください');
    D.products.forEach(function(p){ opt(sp,p.id,p.name+'（'+p.id+'）'); });
    var sl=$('selLoc'); D.locations.forEach(function(l){ opt(sl,l,l); });
    if (validP) sp.value=S.pid; else S.pid='';
    if (!validL){ var sv=load('inv_loc'); S.loc = sv && D.locations.indexOf(sv)>=0 ? sv : D.locations[0]; }
    sl.value=S.loc;
    sp.onchange=function(){ S.pid=sp.value; render(); };
    sl.onchange=function(){ S.loc=sl.value; store('inv_loc',S.loc); S.dest=''; render(); };
  }
  ['持ち出し','移動','入荷','棚卸し'].forEach(function(t){ btn($('seg'), t, '', function(){ setType(t); }); });
  [1,2,3,5,10].forEach(function(n){ btn($('quick'), String(n), '', function(){ $('qty').value=n; }); });
  $('minus').onclick=function(){ $('qty').value=Math.max(0,(parseInt($('qty').value,10)||0)-1); };
  $('plus').onclick=function(){ $('qty').value=(parseInt($('qty').value,10)||0)+1; };
  $('go').onclick=submit;
  $('again').onclick=function(){ show('doneView', false); show('form', true); setType('持ち出し'); window.scrollTo(0,0); };
  $('undo').onclick=undo;
  render();
}

function setType(t){
  S.type=t; S.dest='';
  var p=prod();
  if (t==='棚卸し') $('qty').value=stockAt(S.loc);
  else if (t==='入荷' && p && p.orderQty) $('qty').value=p.orderQty;
  else $('qty').value=1;
  render();
}

function render(){
  var p=prod();
  $('head').style.display = p ? '' : 'none';
  if (p){
    $('pName').textContent=p.name;
    $('locChip').textContent='📍 '+S.loc;
    $('stLoc').textContent=stockAt(S.loc);
    $('stAll').textContent=stockAll();
    Array.prototype.forEach.call(document.querySelectorAll('.u'), function(e){ e.textContent=p.unit; });
  }
  Array.prototype.forEach.call($('seg').children, function(b){ b.classList.toggle('on', b.textContent===S.type); });
  show('destBox', S.type==='移動');
  var d=$('dest'); d.innerHTML='';
  if (S.type==='移動'){
    D.locations.filter(function(l){ return l!==S.loc; }).forEach(function(l){
      btn(d, l, S.dest===l?'on':'', function(){ S.dest=l; render(); });
    });
  }
  $('qtyLbl').textContent=LABEL[S.type];
  $('qtyHint').textContent=HINT[S.type];
  $('quick').style.display = S.type==='棚卸し' ? 'none' : '';
  $('go').textContent = S.type + 'を記録する';
}

var overOk=false;
function confirmOver(){
  if (overOk){ overOk=false; return true; }
  overOk=true;
  showErr('記録上の在庫（'+stockAt(S.loc)+'）より多い数です。正しければもう一度「記録する」を押してください。');
  return false;
}

function submit(){
  showErr('');
  var p=prod();
  var qty=parseInt($('qty').value,10);
  if (!p) return showErr('製品を選んでください');
  if (!$('selStaff').value) return showErr('記録する人（名前）を選んでください');
  if (isNaN(qty) || qty<0) return showErr('数量を入力してください');
  if (S.type!=='棚卸し' && qty===0) return showErr('数量を1以上にしてください');
  if (S.type==='移動' && !S.dest) return showErr('移動先を選んでください');
  if (S.type==='持ち出し' && qty>stockAt(S.loc) && !confirmOver()) return;
  var go=$('go'); go.disabled=true; go.textContent='送信中…';
  var rec={pid:S.pid, loc:S.loc, type:S.type, dest:S.dest, qty:qty, staff:$('selStaff').value, memo:$('memo').value};
  api('submit', {rec:rec}).then(function(res){
    go.disabled=false;
    D.stock[S.pid]=res.stock; S.lastId=res.id;
    $('doneMsg').textContent=p.name+'　'+S.loc+(S.type==='移動'?' → '+S.dest:'')+'　'+S.type+' '+qty+p.unit;
    $('dLoc').textContent=stockAt(S.loc); $('dAll').textContent=res.total;
    $('memo').value='';
    show('form', false); show('doneView', true); $('undo').disabled=false;
    window.scrollTo(0,0);
  }).catch(function(e){ go.disabled=false; render(); showErr('記録できませんでした：'+e.message); });
}

function undo(){
  if (!S.lastId) return;
  var b=$('undo'); b.disabled=true; b.textContent='取り消し中…';
  api('undo', {id:S.lastId}).then(function(res){
    D.stock[S.pid]=res.stock; S.lastId=null;
    b.textContent='間違えたので取り消す';
    show('doneView', false); show('form', true);
    render(); toast('取り消しました'); window.scrollTo(0,0);
  }).catch(function(e){ b.disabled=false; b.textContent='間違えたので取り消す'; showErr('取り消せませんでした：'+e.message); });
}

$('keyGo').onclick=function(){ var v=$('keyIn').value.trim(); if(!v) return; store('inv_key', v); boot(); };
$('retry').onclick=boot;
boot();
</script>
</body>
</html>
